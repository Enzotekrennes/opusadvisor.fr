# Retire la ligne « Generated by Claude Code » que l'environnement cloud des routines
# ajoute en bas des descriptions de PR, à la création comme à chaque modification.
# Règle du dépôt : aucune PR ne mentionne l'outil qui a produit son contenu.
#
# La correction passe par le GITHUB_TOKEN : elle ne relance pas ce workflow.

name: Nettoyage des descriptions de PR

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  clean:
    if: contains(github.event.pull_request.body, 'Generated by [Claude Code]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retirer la ligne
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/pulls/$PR" --jq .body > body.md
          python3 - <<'EOF'
          import re
          body = open('body.md', encoding='utf-8').read()
          # La ligne, et le trait « --- » placé juste au-dessus.
          clean = re.sub(r'\n*(?:-{3,}[ \t]*\n+)?_?Generated by \[Claude Code\]\([^)]*\)_?[ \t]*(?=\n|$)', '', body)
          open('clean.md', 'w', encoding='utf-8').write(clean.rstrip() + '\n')
          EOF
          gh api -X PATCH "repos/$REPO/pulls/$PR" -F body=@clean.md --silent
